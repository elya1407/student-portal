<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админ · Объявления</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: adminNav}"></div>
<div th:replace="~{fragments/header :: alerts}"></div>
<main class="container py-4">
    <h1 class="h3 fw-bold mb-4"><i class="bi bi-megaphone text-primary me-1"></i>Объявления</h1>
    <div class="soft-card p-4 mb-4">
        <h2 class="h5 fw-bold"><i class="bi bi-plus-circle text-primary me-1"></i>Создать пост</h2>
        <form th:action="@{/admin/posts}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Заголовок</label>
                    <input class="form-control" name="title" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Для кого</label>
                    <select class="form-select" name="forSubgroup">
                        <option value="">Для всех</option>
                        <option value="1">Подгруппа 1</option>
                        <option value="2">Подгруппа 2</option>
                        <option value="3">Подгруппа 3</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Текст</label>
                    <textarea class="form-control" name="content" rows="4"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Файл</label>
                    <input class="form-control" name="file" type="file">
                </div>
            </div>
            <button class="btn btn-primary mt-3" type="submit">Опубликовать</button>
        </form>
    </div>

    <div class="row g-3">
        <div th:each="post : ${posts}" class="col-12">
            <div class="soft-card p-4">
                <form th:action="@{/admin/posts/{id}/update(id=${post.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Заголовок</label>
                            <input class="form-control" name="title" th:value="${post.title}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Для кого</label>
                            <select class="form-select" name="forSubgroup">
                                <option value="" th:selected="${post.forSubgroup == null}">Для всех</option>
                                <option value="1" th:selected="${post.forSubgroup == 1}">Подгруппа 1</option>
                                <option value="2" th:selected="${post.forSubgroup == 2}">Подгруппа 2</option>
                                <option value="3" th:selected="${post.forSubgroup == 3}">Подгруппа 3</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Текст</label>
                            <textarea class="form-control" name="content" rows="3" th:text="${post.content}"></textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-3 flex-wrap">
                        <button class="btn btn-sm btn-primary" type="submit">Сохранить</button>
                        <a th:if="${post.fileUrl != null}" class="btn btn-sm btn-outline-primary" th:href="@{${post.fileUrl}}" th:text="'Файл: ' + ${post.fileName}"></a>
                    </div>
                </form>
                <form th:action="@{/admin/posts/{id}/delete(id=${post.id})}" method="post" class="mt-2">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-sm btn-outline-danger" type="submit" onclick="return confirm('Удалить пост?')">Удалить</button>
                </form>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(posts)}" class="col-12"><div class="alert alert-light border">Постов пока нет.</div></div>
    </div>
</main>
<div th:replace="~{fragments/header :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
