<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Расписание — управление</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: adminNav}"></div>
<div th:replace="~{fragments/header :: alerts}"></div>
<main class="container-fluid py-4 px-lg-5">
    <h1 class="h3 fw-bold mb-4"><i class="bi bi-calendar-week text-primary me-1"></i>Расписание — управление</h1>

    <div class="soft-card p-4 mb-4">
        <h2 class="h5 fw-bold mb-3"><i class="bi bi-plus-circle text-primary me-1"></i>Добавить пару</h2>
        <form method="post" th:action="@{/admin/schedule}" class="row g-2 align-items-end">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-2">
                <label class="form-label">Неделя</label>
                <select name="weekType" class="form-select" required>
                    <option value="числитель">Числитель</option>
                    <option value="знаменатель">Знаменатель</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">День</label>
                <select name="dayOfWeek" class="form-select" required>
                    <option value="ПН">Понедельник</option>
                    <option value="ВТ">Вторник</option>
                    <option value="СР">Среда</option>
                    <option value="ЧТ">Четверг</option>
                    <option value="ПТ">Пятница</option>
                    <option value="СБ">Суббота</option>
                </select>
            </div>
            <div class="col-md-1">
                <label class="form-label">П/г</label>
                <select name="subgroup" class="form-select" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Начало</label>
                <input type="time" name="startTime" class="form-control" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Конец</label>
                <input type="time" name="endTime" class="form-control" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Дисциплина</label>
                <input type="text" name="discipline" class="form-control" placeholder="Название пары" required>
            </div>
            <div class="col-md-1">
                <button class="btn btn-primary w-100" type="submit"><i class="bi bi-plus-lg"></i></button>
            </div>
        </form>
        <p class="text-muted small mt-2 mb-0">Одна пара на подгруппу в день на каждой неделе. Если пар в этот день несколько — добавьте отдельным пунктом расписания на следующий слот времени.</p>
    </div>

    <div class="soft-card p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead><tr><th>П/г</th><th>Неделя</th><th>День</th><th>Начало</th><th>Конец</th><th>Дисциплина</th><th></th></tr></thead>
                <tbody>
                <tr th:each="item : ${items}">
                    <form th:id="${'schedule-form-' + item.id}" th:action="@{/admin/schedule/{id}/update(id=${item.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    </form>
                    <td>
                        <select class="form-select form-select-sm" name="subgroup" th:attr="form=${'schedule-form-' + item.id}">
                            <option value="1" th:selected="${item.subgroup == 1}">1</option>
                            <option value="2" th:selected="${item.subgroup == 2}">2</option>
                            <option value="3" th:selected="${item.subgroup == 3}">3</option>
                        </select>
                    </td>
                    <td>
                        <select class="form-select form-select-sm" name="weekType" th:attr="form=${'schedule-form-' + item.id}">
                            <option value="числитель" th:selected="${item.weekType == 'числитель'}">Числитель</option>
                            <option value="знаменатель" th:selected="${item.weekType == 'знаменатель'}">Знаменатель</option>
                        </select>
                    </td>
                    <td>
                        <select class="form-select form-select-sm" name="dayOfWeek" th:attr="form=${'schedule-form-' + item.id}">
                            <option value="ПН" th:selected="${item.dayOfWeek == 'ПН'}">ПН</option>
                            <option value="ВТ" th:selected="${item.dayOfWeek == 'ВТ'}">ВТ</option>
                            <option value="СР" th:selected="${item.dayOfWeek == 'СР'}">СР</option>
                            <option value="ЧТ" th:selected="${item.dayOfWeek == 'ЧТ'}">ЧТ</option>
                            <option value="ПТ" th:selected="${item.dayOfWeek == 'ПТ'}">ПТ</option>
                            <option value="СБ" th:selected="${item.dayOfWeek == 'СБ'}">СБ</option>
                        </select>
                    </td>
                    <td><input type="time" class="form-control form-control-sm" name="startTime" th:value="${item.startTime}" th:attr="form=${'schedule-form-' + item.id}"></td>
                    <td><input type="time" class="form-control form-control-sm" name="endTime" th:value="${item.endTime}" th:attr="form=${'schedule-form-' + item.id}"></td>
                    <td><input type="text" class="form-control form-control-sm" name="discipline" th:value="${item.discipline}" th:attr="form=${'schedule-form-' + item.id}"></td>
                    <td class="text-nowrap">
                        <button class="btn btn-sm btn-primary mb-1" type="submit" th:attr="form=${'schedule-form-' + item.id}">Сохранить</button>
                        <form th:action="@{/admin/schedule/{id}/delete(id=${item.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger mb-1" type="submit" onclick="return confirm('Удалить эту пару?')">Удалить</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(items)}"><td colspan="7" class="text-muted text-center py-3">Расписание пустое — добавьте первую пару выше</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/header :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
