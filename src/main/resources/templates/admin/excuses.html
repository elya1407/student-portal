<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Справки студентов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: adminNav}"></div>
<div th:replace="~{fragments/header :: alerts}"></div>
<main class="container py-4">
    <h1 class="h3 fw-bold mb-4"><i class="bi bi-file-earmark-medical text-primary me-1"></i>Справки и уважительные причины</h1>
    <p class="text-muted">Здесь видны все справки, добавленные студентами. Файл можно скачать и показать преподавателю.</p>

    <div class="soft-card p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead><tr><th>Студент</th><th>П/г</th><th>С</th><th>По</th><th>Причина</th><th>Комментарий</th><th>Файл</th><th>Добавлено</th></tr></thead>
                <tbody>
                <tr th:each="e : ${excuses}">
                    <td th:text="${e.student.fullName}"></td>
                    <td th:text="${e.student.subgroup}"></td>
                    <td th:text="${e.dateFrom}"></td>
                    <td th:text="${e.dateTo}"></td>
                    <td th:text="${e.reasonType}"></td>
                    <td th:text="${e.comment}"></td>
                    <td>
                        <a th:if="${e.fileUrl != null}" class="btn btn-sm btn-outline-primary" th:href="@{${e.fileUrl}}" target="_blank"><i class="bi bi-download"></i> Скачать</a>
                        <span th:if="${e.fileUrl == null}" class="text-muted small">без файла</span>
                    </td>
                    <td class="text-muted small" th:text="${#temporals.format(e.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(excuses)}"><td colspan="8" class="text-muted text-center py-3">Справок пока нет</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/header :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
