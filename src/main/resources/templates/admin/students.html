<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Студенты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: adminNav}"></div>
<div th:replace="~{fragments/header :: alerts}"></div>
<main class="container-fluid py-4 px-lg-5">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-people text-primary me-1"></i>Студенты</h1>
        <form class="d-flex gap-2" method="get" th:action="@{/admin/students}">
            <select class="form-select" name="subgroup">
                <option value="" th:selected="${selectedSubgroup == null}">Все подгруппы</option>
                <option value="1" th:selected="${selectedSubgroup == 1}">П/г 1</option>
                <option value="2" th:selected="${selectedSubgroup == 2}">П/г 2</option>
                <option value="3" th:selected="${selectedSubgroup == 3}">П/г 3</option>
            </select>
            <button class="btn btn-primary" type="submit">Фильтр</button>
        </form>
    </div>
    <div class="soft-card p-4 mb-4">
        <h2 class="h5 fw-bold mb-3"><i class="bi bi-person-plus text-primary me-1"></i>Добавить студента</h2>
        <form method="post" th:action="@{/admin/students/create}" class="row g-2 align-items-end">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-5">
                <label class="form-label">ФИО</label>
                <input type="text" name="fullName" class="form-control" placeholder="Иванов И.И." required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Номер зачётки</label>
                <input type="text" name="recordBookNumber" class="form-control" placeholder="603410312" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Подгруппа</label>
                <select name="subgroup" class="form-select" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" type="submit"><i class="bi bi-plus-lg"></i> Добавить</button>
            </div>
        </form>
        <p class="text-muted small mt-2 mb-0">Студент сможет зарегистрироваться сам, указав это ФИО и номер зачётки.</p>
    </div>

    <div class="soft-card p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead><tr><th>ФИО</th><th>П/г</th><th>Зачётка</th><th>Телефон</th><th>Email</th><th>ДР</th><th>Статус</th><th>Действия</th></tr></thead>
                <tbody>
                <tr th:each="s : ${students}">
                    <td><input class="form-control form-control-sm" name="fullName" th:value="${s.fullName}" style="min-width: 180px;" th:attr="form=${'student-form-' + s.id}"></td>
                    <td><input class="form-control form-control-sm subgroup-input" name="subgroup" th:value="${s.subgroup}" type="number" min="1" max="3" th:attr="form=${'student-form-' + s.id}"></td>
                    <td><input class="form-control form-control-sm" name="recordBookNumber" th:value="${s.recordBookNumber}" style="min-width: 130px;" th:attr="form=${'student-form-' + s.id}"></td>
                    <td><input class="form-control form-control-sm" name="phone" th:value="${s.phone}" th:attr="form=${'student-form-' + s.id}"></td>
                    <td><input class="form-control form-control-sm" name="email" th:value="${s.email}" th:attr="form=${'student-form-' + s.id}"></td>
                    <td th:text="${s.birthDate}"></td>
                    <td><span class="badge" th:classappend="${s.active} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${s.active} ? 'активен' : 'выключен'"></span></td>
                    <td class="text-nowrap">
                        <form th:id="${'student-form-' + s.id}" th:action="@{/admin/students/{id}/update(id=${s.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        </form>
                        <button class="btn btn-sm btn-primary mb-1" type="submit" th:attr="form=${'student-form-' + s.id}"><i class="bi bi-check2"></i> Сохранить</button>
                        <form th:action="@{/admin/students/{id}/reset-password(id=${s.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-warning mb-1" type="submit" onclick="return confirm('Сбросить пароль для этого студента? Ему нужно будет сообщить новый пароль.')"><i class="bi bi-key"></i> Сбросить пароль</button>
                        </form>
                        <form th:action="@{/admin/students/{id}/active(id=${s.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="active" th:value="${!s.active}">
                            <button class="btn btn-sm mb-1" th:classappend="${s.active} ? ' btn-outline-danger' : ' btn-outline-success'" type="submit" th:text="${s.active} ? 'Деактивировать' : 'Активировать'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/header :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
