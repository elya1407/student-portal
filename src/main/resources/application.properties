# Профиль по умолчанию: файловая база H2 (данные сохраняются между перезапусками).
# Файл базы лежит в ./data/studentportal.mv.db рядом с проектом.
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.application.name=student-portal-60341
spring.datasource.url=jdbc:h2:file:./data/studentportal;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

app.upload-dir=uploads
# Ключ для будущего Telegram-бота. Бот должен передавать его в заголовке X-BOT-API-KEY.
app.bot-api-key=dev-bot-key-change-me
