<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Посещаемость</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body th:class="'theme-' + ${student.themeColor}">
<div th:replace="~{fragments/header :: studentNav}"></div>
<main class="container py-4">
    <h1 class="h3 fw-bold mb-4"><i class="bi bi-check2-circle text-primary me-1"></i>Моя посещаемость</h1>
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="soft-card p-4">
                <h2 class="h5 fw-bold"><i class="bi bi-bar-chart-line text-primary me-1"></i>Статистика</h2>
                <div class="stat-line"><span>Всего пар</span><strong th:text="${stats.totalLessons}"></strong></div>
                <div class="stat-line"><span>Присутствовал</span><strong th:text="${stats.present}"></strong></div>
                <div class="stat-line"><span>Пропустил</span><strong th:text="${stats.missed}"></strong></div>
                <div class="progress mt-3"><div class="progress-bar" th:style="'width:' + ${stats.percent} + '%'" th:text="${stats.percent} + '%'"></div></div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="soft-card p-4">
                <h2 class="h5 fw-bold"><i class="bi bi-clock-history text-primary me-1"></i>История отметок</h2>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead><tr><th>Дата</th><th>Время</th><th>Неделя</th><th>Статус</th></tr></thead>
                        <tbody>
                        <tr th:each="item : ${history}">
                            <td th:text="${item.date}"></td>
                            <td th:text="${item.time}"></td>
                            <td th:text="${item.weekType}"></td>
                            <td><span class="badge text-bg-success">Присутствовал</span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(history)}"><td colspan="4" class="text-muted">История пустая.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/header :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
