<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход студента</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="navbar-brand fs-4"><span class="brand-dot"></span> electric60341</a>
            </div>
            <div class="soft-card p-4">
                <h1 class="h3 fw-bold mb-1"><i class="bi bi-box-arrow-in-right text-primary me-1"></i> Вход студента</h1>
                <p class="text-muted small mb-3">Группа 603-41 · личный кабинет</p>
                <div th:if="${param.error}" class="alert alert-danger">Неверная зачётка или пароль</div>
                <div th:if="${param.logout}" class="alert alert-info">Вы вышли из аккаунта</div>
                <div th:if="${param.registered}" class="alert alert-success">Регистрация успешна. Теперь войдите.</div>
                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label class="form-label">Номер зачётки</label>
                        <input class="form-control" name="recordBookNumber" placeholder="Например: 603410101" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input class="form-control" name="password" type="password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Войти</button>
                </form>
                <div class="mt-3 small text-center">
                    Нет аккаунта? <a th:href="@{/register}" class="fw-bold">Зарегистрироваться</a><br>
                    <a th:href="@{/}" class="text-muted"><i class="bi bi-arrow-left"></i> На главную</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
