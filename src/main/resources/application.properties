# Профиль по умолчанию: файловая база H2 (для локального запуска на своём компьютере).
# На хостинге (Render) эти же настройки автоматически переключаются на PostgreSQL
# через переменные окружения SPRING_DATASOURCE_URL / USERNAME / PASSWORD / DRIVER —
# их нужно один раз задать в панели Render, в коде ничего менять не нужно.
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.application.name=student-portal-60341
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/studentportal;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
# Ключ для будущего Telegram-бота. Бот должен передавать его в заголовке X-BOT-API-KEY.
app.bot-api-key=dev-bot-key-change-me
