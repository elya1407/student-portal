<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Расписание</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body th:class="'theme-' + ${student.themeColor}">
<div th:replace="~{fragments/header :: studentNav}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between flex-wrap gap-2 mb-4">
        <div>
            <h1 class="h3 fw-bold"><i class="bi bi-calendar-week text-primary me-1"></i>Расписание подгруппы <span th:text="${student.subgroup}"></span></h1>
            <p class="text-muted mb-0">Сейчас неделя: <strong th:text="${currentWeek}"></strong></p>
        </div>
    </div>
    <div class="soft-card p-4">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead><tr><th>Неделя</th><th>День</th><th>Время</th><th>Дисциплина</th></tr></thead>
                <tbody>
                <tr th:each="item : ${items}">
                    <td><span class="badge" th:classappend="${item.weekType == currentWeek} ? ' text-bg-primary' : ' text-bg-light text-dark'" th:text="${item.weekType}"></span></td>
                    <td th:text="${item.dayOfWeek}"></td>
                    <td><span th:text="${item.startTime}"></span>–<span th:text="${item.endTime}"></span></td>
                    <td th:text="${item.discipline}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/header :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
