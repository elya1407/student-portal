<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body th:class="'theme-' + ${student.themeColor}">
<div th:replace="~{fragments/header :: studentNav}"></div>
<div th:replace="~{fragments/header :: alerts}"></div>
<main class="container py-4">
    <h1 class="h3 fw-bold mb-4"><i class="bi bi-person-circle text-primary me-1"></i>Профиль</h1>
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="soft-card p-4 mb-4">
                <h2 class="h5 fw-bold mb-3"><i class="bi bi-image text-primary me-1"></i>Аватар</h2>
                <div class="d-flex align-items-center gap-3">
                    <img th:if="${student.avatarUrl != null}" th:src="@{${student.avatarUrl}}" class="avatar-circle-lg" alt="avatar">
                    <div th:if="${student.avatarUrl == null}" class="avatar-placeholder" th:text="${student.fullName != null and !student.fullName.isEmpty() ? #strings.substring(student.fullName,0,1) : '?'}"></div>
                    <form th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data" class="flex-grow-1">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="file" name="avatar" class="form-control form-control-sm mb-2" accept="image/*" required>
                        <button class="btn btn-sm btn-outline-primary" type="submit"><i class="bi bi-upload me-1"></i>Загрузить</button>
                    </form>
                </div>
            </div>

            <div class="soft-card p-4 mb-4">
                <h2 class="h5 fw-bold mb-3"><i class="bi bi-palette text-primary me-1"></i>Цвет темы</h2>
                <p class="text-muted small">Выберите цвет оформления кабинета — сохранится на вашем аккаунте.</p>
                <form th:action="@{/profile/theme}" method="post" class="d-flex gap-3 flex-wrap">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button th:each="c : ${themeColors}"
                            class="theme-swatch"
                            th:classappend="${'swatch-' + c + (student.themeColor == c ? ' active' : '')}"
                            type="submit" name="themeColor" th:value="${c}"
                            th:title="${c}">
                        <i class="bi bi-check-lg text-white" th:if="${student.themeColor == c}"></i>
                    </button>
                </form>
            </div>

            <div class="soft-card p-4">
                <h2 class="h5 fw-bold"><i class="bi bi-card-list text-primary me-1"></i>Данные студента</h2>
                <p class="text-muted">ФИО и номер зачётки редактирует только староста.</p>
                <div class="mb-3"><strong>ФИО:</strong> <span th:text="${student.fullName}"></span></div>
                <div class="mb-3"><strong>Зачётка:</strong> <span th:text="${student.recordBookNumber}"></span></div>
                <div class="mb-3"><strong>Подгруппа:</strong> <span th:text="${student.subgroup}"></span></div>
                <form th:action="@{/profile}" th:object="${profileUpdateRequest}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label class="form-label">Телефон</label>
                        <input class="form-control" th:field="*{phone}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input class="form-control" th:field="*{email}" type="email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Дата рождения</label>
                        <input class="form-control" th:field="*{birthDate}" type="date">
                    </div>
                    <button class="btn btn-primary" type="submit">Сохранить</button>
                </form>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="soft-card p-4">
                <h2 class="h5 fw-bold"><i class="bi bi-key text-primary me-1"></i>Смена пароля</h2>
                <form th:action="@{/profile/password}" th:object="${passwordChangeRequest}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label class="form-label">Старый пароль</label>
                        <input class="form-control" th:field="*{oldPassword}" type="password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Новый пароль</label>
                        <input class="form-control" th:field="*{newPassword}" type="password" required minlength="6">
                    </div>
                    <button class="btn btn-outline-primary" type="submit">Изменить пароль</button>
                </form>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/header :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
