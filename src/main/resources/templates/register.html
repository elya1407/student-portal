<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="navbar-brand fs-4"><span class="brand-dot"></span> electric60341</a>
            </div>
            <div class="soft-card p-4">
                <h1 class="h3 fw-bold mb-2"><i class="bi bi-person-plus text-primary me-1"></i> Регистрация студента</h1>
                <p class="text-muted">Введите ФИО как в списке группы и свой номер зачётки. SMS не нужен — защита через зачётку + пароль.</p>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">ФИО</label>
                            <input class="form-control" th:field="*{fullName}" placeholder="Баёк М.А." required>
                            <div class="text-danger small" th:errors="*{fullName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Номер зачётки</label>
                            <input class="form-control" th:field="*{recordBookNumber}" placeholder="603410101" required>
                            <div class="text-danger small" th:errors="*{recordBookNumber}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Телефон</label>
                            <input class="form-control" th:field="*{phone}" placeholder="+7...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input class="form-control" th:field="*{email}" type="email" placeholder="mail@example.com">
                            <div class="text-danger small" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Дата рождения</label>
                            <input class="form-control" th:field="*{birthDate}" type="date">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Пароль</label>
                            <input class="form-control" th:field="*{password}" type="password" required>
                            <div class="text-danger small" th:errors="*{password}"></div>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 mt-4" type="submit">Создать аккаунт</button>
                </form>
                <div class="mt-3 small text-center"><a th:href="@{/login}" class="fw-bold">Уже есть аккаунт?</a></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
