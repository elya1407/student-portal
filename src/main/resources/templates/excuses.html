<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Справки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body th:class="'theme-' + ${student.themeColor}">
<div th:replace="~{fragments/header :: studentNav}"></div>
<div th:replace="~{fragments/header :: alerts}"></div>
<main class="container py-4">
    <h1 class="h3 fw-bold mb-4"><i class="bi bi-file-earmark-medical text-primary me-1"></i>Справки и уважительные причины</h1>

    <div class="soft-card p-4 mb-4">
        <h2 class="h5 fw-bold mb-3"><i class="bi bi-plus-circle text-primary me-1"></i>Добавить</h2>
        <p class="text-muted small">Если пропускали пары или знаете, что будете отсутствовать — добавьте сюда даты и, если есть, файл (больничный, приказ и т.д.). Староста это увидит.</p>
        <form th:action="@{/excuses}" method="post" enctype="multipart/form-data" class="row g-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-md-3">
                <label class="form-label">Дата с</label>
                <input type="date" name="dateFrom" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Дата по</label>
                <input type="date" name="dateTo" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Причина</label>
                <select name="reasonType" class="form-select" required>
                    <option value="Больничный">Больничный</option>
                    <option value="Приказ">Приказ / соревнования</option>
                    <option value="Семейные обстоятельства">Семейные обстоятельства</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Файл справки (необязательно)</label>
                <input type="file" name="file" class="form-control">
            </div>
            <div class="col-12">
                <label class="form-label">Комментарий</label>
                <input type="text" name="comment" class="form-control" placeholder="Например: ОРВИ, справка от поликлиники №5">
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit"><i class="bi bi-send me-1"></i>Отправить</button>
            </div>
        </form>
    </div>

    <div class="soft-card p-3">
        <h2 class="h5 fw-bold p-2"><i class="bi bi-clock-history text-primary me-1"></i>Мои справки</h2>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead><tr><th>С</th><th>По</th><th>Причина</th><th>Комментарий</th><th>Файл</th></tr></thead>
                <tbody>
                <tr th:each="e : ${excuses}">
                    <td th:text="${e.dateFrom}"></td>
                    <td th:text="${e.dateTo}"></td>
                    <td th:text="${e.reasonType}"></td>
                    <td th:text="${e.comment}"></td>
                    <td>
                        <a th:if="${e.fileUrl != null}" class="btn btn-sm btn-outline-primary" th:href="@{${e.fileUrl}}" target="_blank"><i class="bi bi-download"></i></a>
                        <span th:if="${e.fileUrl == null}" class="text-muted small">—</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(excuses)}"><td colspan="5" class="text-muted text-center py-3">Пока нет добавленных справок</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/header :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
